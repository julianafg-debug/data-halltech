services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: centralhall
      POSTGRES_USER: centralhall
      POSTGRES_PASSWORD: centralhall
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - central-hall-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centralhall -d centralhall"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  central-hall-postgres:
